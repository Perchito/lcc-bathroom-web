# Pages CMS configuration — https://pagescms.org
# Edit content at https://app.pagescms.org. Mirrors public/admin/config.yml
# (Sveltia CMS); keep the two in step when adding editable fields.

media:
  input: public/gallery
  output: /gallery
  rename: safe

content:
  - name: settings
    label: Company info & homepage text
    type: file
    path: src/content/settings.json
    format: json
    fields:
      - name: company
        label: Business details
        type: object
        fields:
          - { name: name, label: Business name, type: string }
          - { name: shortName, label: Short name, type: string }
          - { name: established, label: Year established, type: string }
          - { name: tagline, label: Headline (big text on the homepage), type: string }
          - { name: heroSupport, label: Homepage intro paragraph, type: text }
          - { name: statement, label: About us paragraph, type: text }
          - { name: yearsInBusiness, label: Years in business (e.g. 15+), type: string }
          - { name: phone, label: Phone number (as shown on the site), type: string }
          - name: phoneHref
            label: Phone link
            type: string
            description: "Advanced — keep the tel:+44... format. Only change if the number changes."
          - { name: email, label: Email address, type: string }
          - { name: serviceArea, label: Area you cover, type: string }
          - { name: license, label: License / insurance line, type: string }
          - { name: hours, label: Opening hours, type: string }
          - { name: googleReviewsUrl, label: Google reviews link, type: string }
      - name: stats
        label: Stat line (small facts under the homepage headline)
        type: object
        list: true
        fields:
          - { name: value, label: Number or word, type: string }
          - { name: label, label: Caption, type: string }

  - name: services
    label: Services
    type: file
    path: src/content/services.json
    format: json
    fields:
      - name: items
        label: Services
        type: object
        list: true
        fields:
          - { name: title, label: Service name, type: string }
          - { name: description, label: Description, type: text }

  - name: process
    label: How it works
    type: file
    path: src/content/process.json
    format: json
    fields:
      - name: items
        label: Steps
        type: object
        list: true
        fields:
          - { name: step, label: Step number (e.g. 01), type: string }
          - { name: title, label: Step title, type: string }
          - { name: description, label: Description, type: text }

  - name: reviews
    label: Reviews
    type: file
    path: src/content/reviews.json
    format: json
    fields:
      - name: items
        label: Reviews
        type: object
        list: true
        fields:
          - { name: name, label: Client name, type: string }
          - { name: job, label: Job / context (short), type: string }
          - { name: when, label: Year, type: string }
          - name: rating
            label: Stars (1 to 5)
            type: number
            default: 5
            options: { min: 1, max: 5 }
          - { name: text, label: Review text, type: text }

  - name: gallery
    label: Gallery / projects
    type: file
    path: src/content/gallery.json
    format: json
    fields:
      - name: projects
        label: Projects
        type: object
        list: true
        fields:
          - name: sector
            label: Which gallery
            type: select
            options:
              values:
                - { name: luxury, label: Luxury Bathrooms }
                - { name: council, label: Council Bathrooms }
          - { name: title, label: Project title, type: string }
          - name: category
            label: Category
            type: select
            description: Use a Luxury category (Bathrooms / Kitchens / Additions) for a Luxury project, and a Council category for a Council project.
            options:
              values: [Bathrooms, Kitchens, Additions, Full refits, Wet rooms, Accessible adaptations]
          - { name: meta, label: "Small caption (e.g. 'Full renovation · Riverside')", type: string }
          - { name: image, label: Main photo (shown on the gallery grid), type: image }
          - name: images
            label: More photos
            type: image
            list: true
            required: false
            description: Extra photos of the same project — visitors swipe through them in the pop-up view. The main photo is always shown first.
          - { name: blurb, label: One-line description, type: text }
